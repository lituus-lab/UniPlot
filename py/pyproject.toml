[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniplot"
version = "1.0.0"
description = "Python binding for the UniPlot scientific visualisation engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lbartoletti" }]
keywords = ["nim", "plotting", "visualization", "charts"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lituus-lab/UniPlot"
Repository = "https://github.com/lituus-lab/UniPlot"
Issues = "https://github.com/lituus-lab/UniPlot/issues"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools]
packages = ["uniplot"]
